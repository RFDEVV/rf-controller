[env:esp32s3]
; Pin Arduino-ESP32 3.2.1 (pioarduino) untuk HID stabil dan menghindari
; USBHostMSC/FS.h yang ditambahkan pada rilis 3.3.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  olikraus/U8g2@^2.35.0
