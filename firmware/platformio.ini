[env:esp32s3]
; Pin Arduino-ESP32 3.3.x (pioarduino) karena firmware memakai USBHIDGamepad.
; Versi 4.x baru-baru ini berubah dan dapat menyertakan USBMSC yang membutuhkan
; FS.h, sehingga build lama gagal meskipun proyek tidak memakai USB MSC.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
  -UARDUINO_USB_MODE
  -DARDUINO_USB_MODE=0
  -UARDUINO_USB_CDC_ON_BOOT
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  olikraus/U8g2@^2.35.0
